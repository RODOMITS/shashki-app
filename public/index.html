<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#262626">
  <meta name="color-scheme" content="dark">
  <title>Шашки.App</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <svg class="icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="back-icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="arrow-icon" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="match-icon" viewBox="0 0 24 24"><path d="M4 7h15m-4-4 4 4-4 4m5 6H5m4-4-4 4 4 4" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="bot-icon" viewBox="0 0 24 24"><path d="M12 3v4m-5 1h10l3 3v7l-2 2H6l-2-2v-7zm-5 5v3m20-3v3M8 13v2m8-2v2" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="3" r="1.3" fill="currentColor"/></symbol>
    <symbol id="crown-icon" viewBox="0 0 24 24"><path d="m3 6 4.5 4L12 4l4.5 6L21 6l-2 12H5zM6 21h12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="app-header">
    <div class="header-inner">
      <button id="back" type="button" class="back" aria-label="В меню" hidden><svg aria-hidden="true"><use href="#back-icon"/></svg></button>
      <h1><img src="/mark.svg" alt="" width="30" height="30">Шашки<span>.App</span></h1>
    </div>
  </header>

  <main class="main">
    <section id="menu" class="menu" aria-label="Главное меню">
      <div class="profile">
        <div id="profile-avatar" class="avatar" aria-hidden="true">Ш</div>
        <h2 id="profile-name">Шашки.App</h2>
      </div>
      <div class="play-options">
        <button id="resume" class="mode online" type="button" hidden>
          <span class="mode-icon"><svg aria-hidden="true"><use href="#arrow-icon"/></svg></span>
          <span class="mode-copy"><strong>Продолжить партию</strong><small id="resume-label"></small></span>
          <svg class="mode-arrow" aria-hidden="true"><use href="#arrow-icon"/></svg>
        </button>
        <button id="queue" class="mode online" type="button" disabled>
          <span class="mode-icon"><svg aria-hidden="true"><use href="#match-icon"/></svg></span>
          <span class="mode-copy"><strong>Играть в матчмейкинг</strong><small>Случайный соперник</small></span>
          <svg class="mode-arrow" aria-hidden="true"><use href="#arrow-icon"/></svg>
        </button>
        <button id="bot" class="mode practice" type="button" disabled>
          <span class="mode-icon"><svg aria-hidden="true"><use href="#bot-icon"/></svg></span>
          <span class="mode-copy"><strong>Играть с ботом</strong><small id="bot-levels-label">Три уровня сложности</small></span>
          <svg class="mode-arrow" aria-hidden="true"><use href="#arrow-icon"/></svg>
        </button>
        <div id="search" class="search" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span><strong>Ищем соперника</strong><small>Подбор идёт в этой вкладке.</small></span>
          <button id="cancel-search" type="button" class="plain">Отменить</button>
        </div>
        <p id="menu-note" class="note" role="status">Подключаемся к Telegram…</p>
        <button id="retry" class="plain retry" type="button" hidden>Повторить</button>
      </div>

      <section class="statistics" aria-labelledby="stats-label">
        <h2 id="stats-label">Статистика</h2>
        <dl class="score-grid">
          <div><dt>Партии</dt><dd id="stats-played">–</dd></div>
          <div><dt>Победы</dt><dd id="stats-wins">–</dd></div>
          <div><dt>Ничьи</dt><dd id="stats-draws">–</dd></div>
          <div><dt>Поражения</dt><dd id="stats-losses">–</dd></div>
        </dl>
      </section>
    </section>

    <section id="game" class="game" aria-label="Партия" hidden>
      <div class="play-area">
        <div class="player opponent">
          <div class="avatar" id="opponent-avatar" aria-hidden="true">Б</div>
          <div class="player-name"><strong id="opponent-name">Соперник</strong><small id="opponent-side"></small></div>
          <span id="opponent-count" class="counter"></span>
        </div>
        <p id="ai-comment" class="ai-comment" role="status" aria-live="polite" hidden></p>
        <div class="surface"><div class="board" id="board" role="group" aria-label="Доска русских шашек"></div></div>
        <div class="player">
          <div class="avatar" id="own-avatar" aria-hidden="true">В</div>
          <div class="player-name"><strong>Вы</strong><small id="own-side"></small></div>
          <span id="own-count" class="counter"></span>
        </div>
        <div class="game-footer">
          <div id="game-status" class="game-status" role="status" aria-live="polite"></div>
          <button id="resign" class="plain" type="button">Сдаться</button>
          <button id="finish" class="plain" type="button" hidden>В меню</button>
        </div>
        <p id="game-note" class="note" role="status"></p>
      </div>
    </section>
  </main>

  <dialog id="bot-dialog" aria-labelledby="bot-heading">
    <form id="bot-form">
      <h2 id="bot-heading">Игра с ботом</h2>
      <label for="level">Сложность</label>
      <select id="level">
        <option value="0">Лёгкий</option>
        <option selected value="1">Средний</option>
        <option value="2">Сильный</option>
        <option id="ai-level" value="3" disabled>ИИ (недоступен)</option>
      </select>
      <label for="side">Цвет шашек</label>
      <select id="side"><option value="1">Белые</option><option value="-1">Чёрные</option><option value="0">Случайный</option></select>
      <div class="dialog-actions"><button class="plain" id="close-bot" type="button">Отмена</button><button class="solid" type="submit">Начать партию</button></div>
    </form>
  </dialog>
  <dialog id="resign-dialog" aria-labelledby="resign-heading">
    <h2 id="resign-heading">Сдаться?</h2>
    <p>Сопернику будет засчитана победа.</p>
    <div class="dialog-actions"><button class="plain" id="close-resign" type="button">Продолжить</button><button class="solid" id="confirm-resign" type="button">Сдаться</button></div>
  </dialog>
</body>
</html>
